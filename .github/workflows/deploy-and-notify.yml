name: Notify Subscribers After Deploy

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for published content changes
        id: check_changes
        run: |
          ADDED_MODIFIED=$(git diff --name-status HEAD~1 HEAD | grep -E '^[AM]\s+src/data/(blog-posts|thoughts)/published/' || true)

          if [ -n "$ADDED_MODIFIED" ]; then
            echo "Published content was added or modified:"
            echo "$ADDED_MODIFIED"
            echo "should_notify=true" >> $GITHUB_OUTPUT
          else
            echo "No published content changes - skipping notification"
            echo "should_notify=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger email notifications
        if: steps.check_changes.outputs.should_notify == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -X POST "$SITE_URL/api/admin/trigger-content-sync" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --fail --silent --show-error
          echo "Email notification triggered"

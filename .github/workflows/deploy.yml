name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify required secrets are configured
        run: |
          REQUIRED_SECRETS="JWT_SECRET CRON_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET RESEND_API_KEY"
          CONFIGURED=$(npx wrangler secret list --json 2>/dev/null | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(data.map(s => s.name).join(' '));
          ")
          MISSING=""
          for secret in $REQUIRED_SECRETS; do
            if ! echo "$CONFIGURED" | grep -qw "$secret"; then
              MISSING="$MISSING $secret"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required Cloudflare Worker secrets:$MISSING"
            echo "Set them with: npx wrangler secret put <SECRET_NAME>"
            exit 1
          fi
          echo "All required secrets are configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
